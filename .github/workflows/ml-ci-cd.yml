name: ml-ci-cd

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-train-validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          uv pip install --system -r pyproject.toml
          uv pip install --system -r pyproject.toml --extra dev

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Pull versioned data with DVC
        run: |
          pip install dvc
          dvc pull

      - name: Run training + evaluation pipeline
        run: dvc repro

      - name: Run quality gate against production model
        run: python -m app.quality_gate --new-metrics metrics.json --max-mae-increase 0.5

      - uses: iterative/setup-cml@v2
        if: github.event_name == 'pull_request'

      - name: Post metrics to the pull request
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Model evaluation results" > report.md
          echo '```json' >> report.md
          cat metrics.json >> report.md
          echo '```' >> report.md
          cml comment create report.md

  promote-and-deploy:
    needs: test-train-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -r pyproject.toml

      - name: Promote model to production
        run: python -m app.promote --run-id-file run_id.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

      - name: Build and push image
        run: |
          docker build --provenance=false --sbom=false --platform linux/amd64 -t student-score-predictor:latest .
          docker tag student-score-predictor:latest ${{ secrets.ECR_REGISTRY }}/student-score-predictor:latest
          docker push ${{ secrets.ECR_REGISTRY }}/student-score-predictor:latest